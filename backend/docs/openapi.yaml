openapi: 3.0.3

info:
  title: Restaurant Management App API
  version: 1.0.0
  description: API documentation for the restaurant management backend

servers:
  - url: https://restaurent-app-3ms8.onrender.com
    description: Production server
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Health
    description: Backend health checks
  - name: Authentication
    description: User login and authentication
  - name: Users
    description: Admin staff account management
  - name: Menu
    description: Menu categories and menu item management
  - name: Tables
    description: Restaurant table management
  - name: Orders
    description: Restaurant order management
  - name: Kitchen
    description: Kitchen order tickets and preparation status
  - name: Settings
    description: Restaurant and billing configuration
  - name: Customers
    description: Restaurant customer records
  - name: Suppliers
    description: Supplier records
  - name: Inventory
    description: Stock levels and reorder thresholds
  - name: Roles
    description: Seeded staff roles and permissions
  - name: Reports
    description: Date-bounded order and sales summaries
  - name: Billing
    description: Bill generation and retrieval
  - name: Payments
    description: Payment recording

paths:
  /api/health:
    get:
      summary: Check backend health
      tags:
        - Health
      responses:
        '200':
          description: Backend is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: AHVANAM Restaurant Management API is running
                  timestamp:
                    type: string
                    format: date-time

  /api/auth/login:
    post:
      summary: Log in to the restaurant management app
      description: Authenticate a user using their login credentials.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: YourPasswordHere
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful.
                  data:
                    type: object
                    required: [token, user]
                    properties:
                      token:
                        type: string
                        description: JWT authentication token
                      user:
                        type: object
                        description: Authenticated user's information
                        additionalProperties: true
        '400':
          description: Missing or invalid request fields
        '401':
          description: Invalid login credentials
        '500':
          description: Internal server error

  /api/auth/logout:
    post:
      summary: Log out the current user
      description: Revoke the current bearer token. The client should also discard the token.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Missing, invalid, or expired authentication token
        '500':
          description: Internal server error

  /api/users:
    get:
      summary: Get all staff accounts
      description: Retrieve Waiter and Kitchen Staff accounts.
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Staff accounts retrieved successfully
        '401':
          description: Missing or invalid authentication token
        '403':
          description: Admin role required
        '500':
          description: Internal server error

    post:
      summary: Create a staff account
      description: Create a Waiter or Kitchen Staff account. Admin authorization is required.
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - username
                - password
                - roleId
              properties:
                fullName:
                  type: string
                  example: Test Waiter
                username:
                  type: string
                  example: testwaiter01
                email:
                  type: string
                  format: email
                  nullable: true
                  example: testwaiter01@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: TempPass123!
                roleId:
                  type: integer
                  enum: [2, 3]
                  description: '2 = Waiter, 3 = Kitchen Staff'
                  example: 2
      responses:
        '201':
          description: Staff account created successfully
        '400':
          description: Invalid staff details
        '401':
          description: Missing or invalid authentication token
        '403':
          description: Admin role required
        '409':
          description: Username or email already exists
        '500':
          description: Internal server error

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Staff user ID
        schema:
          type: integer
          minimum: 1

    get:
      summary: Get a staff account by ID
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Staff account retrieved successfully
        '400':
          description: Invalid staff ID
        '401':
          description: Missing or invalid authentication token
        '403':
          description: Admin role required
        '404':
          description: Staff member not found
        '500':
          description: Internal server error

    put:
      summary: Update a staff account
      description: Update the staff member's name, email, and role.
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - roleId
              properties:
                fullName:
                  type: string
                  example: Updated Waiter
                email:
                  type: string
                  format: email
                  nullable: true
                  example: waiter@example.com
                roleId:
                  type: integer
                  enum: [2, 3]
                  example: 2
      responses:
        '200':
          description: Staff account updated successfully
        '400':
          description: Invalid staff details
        '401':
          description: Missing or invalid authentication token
        '403':
          description: Admin role required
        '404':
          description: Staff member not found
        '409':
          description: Email already exists
        '500':
          description: Internal server error

  /api/users/{id}/deactivate:
    patch:
      summary: Deactivate a staff account
      description: Deactivate an existing Waiter or Kitchen Staff account.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Staff user ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Staff account deactivated successfully
        '400':
          description: Invalid staff ID
        '401':
          description: Missing or invalid authentication token
        '403':
          description: Admin role required
        '404':
          description: Staff member not found
        '409':
          description: Staff account is already deactivated
        '500':
          description: Internal server error

  /api/menu/categories:
    get:
      summary: Get all menu categories
      description: Retrieve menu categories.
      tags:
        - Menu
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Menu categories retrieved successfully
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '500':
          description: Internal server error

    post:
      summary: Create a menu category
      description: Create a new menu category. Admin access is required.
      tags:
        - Menu
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Starters
                description:
                  type: string
                  nullable: true
                  example: Appetizers and starters
      responses:
        '201':
          description: Menu category created successfully
        '400':
          description: Invalid category details
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '409':
          description: Category already exists
        '500':
          description: Internal server error

  /api/menu/categories/{id}:
    put:
      summary: Update a menu category
      description: Update an existing menu category. Admin access is required.
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Menu category ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Main Course
                description:
                  type: string
                  nullable: true
                  example: Main course dishes
                isActive:
                  type: boolean
                  default: true
                  example: true
      responses:
        '200':
          description: Menu category updated successfully
        '400':
          description: Invalid category details
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Category not found
        '409':
          description: Category name already exists
        '500':
          description: Internal server error

  /api/menu/items:
    get:
      summary: Get all menu items
      description: Retrieve menu items and their category names.
      tags:
        - Menu
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Menu items retrieved successfully
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '500':
          description: Internal server error

    post:
      summary: Create a menu item
      description: Create a menu item. Admin access is required.
      tags:
        - Menu
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
                - name
                - price
              properties:
                categoryId:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Paneer Tikka
                description:
                  type: string
                  nullable: true
                  example: Grilled paneer with spices
                price:
                  type: number
                  format: double
                  minimum: 0
                  example: 220
      responses:
        '201':
          description: Menu item created successfully
        '400':
          description: Invalid menu item details
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Menu category not found
        '500':
          description: Internal server error

  /api/menu/items/{id}:
    get:
      summary: Get a menu item by ID
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Menu item ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Menu item retrieved successfully
        '400':
          description: Invalid menu item ID
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Menu item not found
        '500':
          description: Internal server error

    put:
      summary: Update a menu item
      description: Update a menu item. Admin access is required.
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Menu item ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
                - name
                - price
              properties:
                categoryId:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: Paneer Tikka
                description:
                  type: string
                  nullable: true
                  example: Updated description
                price:
                  type: number
                  format: double
                  minimum: 0
                  example: 240
      responses:
        '200':
          description: Menu item updated successfully
        '400':
          description: Invalid menu item details
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Internal server error

    delete:
      summary: Delete a menu item
      description: Permanently delete a menu item. Admin access is required.
      tags:
        - Menu
      operationId: deleteMenuItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Menu item ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Menu item deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Menu item deleted successfully.
        '400':
          description: Invalid menu item ID
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Internal server error

  /api/menu/items/{id}/availability:
    patch:
      summary: Update menu item availability
      description: Enable or disable a menu item. Admin access is required.
      tags:
        - Menu
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Menu item ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isAvailable
              properties:
                isAvailable:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Menu item availability updated successfully
        '400':
          description: Invalid availability value
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Menu item not found
        '500':
          description: Internal server error

  /api/tables:
    get:
      summary: List active restaurant tables
      description: Admin, Waiter, and Kitchen Staff access is allowed.
      tags:
        - Tables
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, occupied, reserved, maintenance]
      responses:
        '200':
          description: Tables retrieved successfully
        '400':
          description: Invalid table status filter
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '500':
          description: Internal server error

    post:
      summary: Create a restaurant table
      description: Admin access is required.
      tags:
        - Tables
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tableNumber
              properties:
                tableNumber:
                  type: string
                  maxLength: 30
                  example: T1
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 1
                  example: 4
                status:
                  type: string
                  enum: [available, occupied, reserved, maintenance]
                  default: available
      responses:
        '201':
          description: Table created successfully
        '400':
          description: Invalid table details
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '409':
          description: Table number already exists
        '500':
          description: Internal server error

  /api/tables/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Restaurant table ID
        schema:
          type: integer
          minimum: 1

    get:
      summary: Get an active table by ID
      description: Admin, Waiter, and Kitchen Staff access is allowed.
      tags:
        - Tables
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Table retrieved successfully
        '400':
          description: Invalid table ID
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Table not found
        '500':
          description: Internal server error

    patch:
      summary: Update a restaurant table
      description: Admin access is required.
      tags:
        - Tables
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                tableNumber:
                  type: string
                  maxLength: 30
                capacity:
                  type: integer
                  minimum: 1
                  maximum: 65535
                status:
                  type: string
                  enum: [available, occupied, reserved, maintenance]
                isActive:
                  type: boolean
      responses:
        '200':
          description: Table updated successfully
        '400':
          description: Invalid table details
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Table not found
        '409':
          description: Table number already exists
        '500':
          description: Internal server error

    delete:
      summary: Deactivate a restaurant table
      description: Soft-delete a table so historical order references remain valid. Admin access is required.
      tags:
        - Tables
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Table deactivated successfully
        '400':
          description: Invalid table ID
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Table not found
        '500':
          description: Internal server error

  /api/orders:
    get:
      summary: List orders
      description: Waiters receive only their own orders. Admin and Kitchen Staff can view all orders.
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, preparing, ready, completed, cancelled]
        - name: tableId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Orders retrieved successfully
        '400':
          description: Invalid order filter
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '500':
          description: Internal server error

    post:
      summary: Create and submit an order
      description: Prices are loaded from the menu on the server. A pending kitchen ticket is created atomically with the order.
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Reuse the same key to safely retry an identical order request.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                tableId:
                  type: integer
                  minimum: 1
                  nullable: true
                notes:
                  type: string
                  maxLength: 2000
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [menuItemId, quantity]
                    additionalProperties: false
                    properties:
                      menuItemId:
                        type: integer
                        minimum: 1
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 999
                      notes:
                        type: string
                        maxLength: 1000
      responses:
        '201':
          description: Order and kitchen ticket created
        '200':
          description: Existing order returned for a repeated Idempotency-Key
        '400':
          description: Invalid order payload or menu item reference
        '401':
          description: Authentication required
        '403':
          description: Admin or Waiter role required
        '404':
          description: Active table not found
        '409':
          description: Table unavailable, item unavailable, or idempotency key conflict
        '500':
          description: Internal server error

  /api/orders/{id}:
    get:
      summary: Get an order with its items and kitchen tickets
      description: Waiters can retrieve only their own orders.
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order retrieved successfully
        '400':
          description: Invalid order ID
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Order not found
        '500':
          description: Internal server error

  /api/orders/{id}/status:
    patch:
      summary: Complete or cancel an order
      description: A ready order can be completed. Pending orders can be cancelled by their waiter or an admin; admins may also cancel preparing orders.
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [completed, cancelled]
      responses:
        '200':
          description: Order status updated successfully
        '400':
          description: Invalid order ID or status
        '401':
          description: Authentication required
        '403':
          description: Admin or Waiter role required
        '404':
          description: Order not found
        '409':
          description: Invalid order status transition
        '500':
          description: Internal server error

  /api/kitchen:
    get:
      summary: List kitchen tickets
      description: Admin and Kitchen Staff can retrieve tickets and their order items.
      tags:
        - Kitchen
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, preparing, ready]
      responses:
        '200':
          description: Kitchen tickets retrieved successfully
        '400':
          description: Invalid ticket status filter
        '401':
          description: Authentication required
        '403':
          description: Admin or Kitchen Staff role required
        '500':
          description: Internal server error

  /api/kitchen/{id}:
    get:
      summary: Get a kitchen ticket with its items
      tags:
        - Kitchen
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Kitchen ticket retrieved successfully
        '400':
          description: Invalid ticket ID
        '401':
          description: Authentication required
        '403':
          description: Admin or Kitchen Staff role required
        '404':
          description: Kitchen ticket not found
        '500':
          description: Internal server error

  /api/kitchen/{id}/status:
    patch:
      summary: Advance a kitchen ticket
      description: Only pending → preparing → ready transitions are allowed. The associated order status is updated atomically.
      tags:
        - Kitchen
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [preparing, ready]
      responses:
        '200':
          description: Kitchen ticket and order status updated successfully
        '400':
          description: Invalid ticket ID or requested status
        '401':
          description: Authentication required
        '403':
          description: Admin or Kitchen Staff role required
        '404':
          description: Kitchen ticket not found
        '409':
          description: Invalid kitchen status transition
        '500':
          description: Internal server error

  /api/settings:
    get:
      summary: List restaurant settings
      description: Authenticated restaurant roles can read configured settings.
      tags:
        - Settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Settings retrieved successfully
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '500':
          description: Internal server error

  /api/settings/{key}:
    put:
      summary: Create or update a restaurant setting
      description: Admin access is required. Tax rate, payment methods, and currency are supported.
      tags:
        - Settings
      security:
        - BearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum: [tax_rate, payment_methods, currency]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties:
                value:
                  oneOf:
                    - type: number
                      minimum: 0
                      maximum: 100
                      description: Tax percentage for tax_rate.
                    - type: array
                      minItems: 1
                      items:
                        type: string
                      description: Payment identifiers; cash must be included.
                    - type: string
                      pattern: '^[A-Z]{3}$'
                      description: ISO-style currency code.
      responses:
        '200':
          description: Setting updated successfully
        '400':
          description: Invalid setting value
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Unsupported setting key
        '500':
          description: Internal server error

  /api/customers:
    get:
      summary: List customers
      tags:
        - Customers
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Customers retrieved successfully
        '400':
          description: Invalid customer filter
        '401':
          description: Authentication required
        '403':
          description: Admin or Waiter role required
        '500':
          description: Internal server error
    post:
      summary: Create a customer
      tags:
        - Customers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
